<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Midnight Mayhem — Vision Harness</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --night-0: #070B18; --night-1: #101A33; --night-2: #1E2B4D;
      --steel-0: #232733; --steel-1: #3A404F; --steel-2: #5B6375;
      --moon: #E8F0FF; --amber-1: #F2A03D; --amber-2: #C2601B; --danger: #E8434F;
      --pose: #4FE3F5;
    }
    html, body { margin: 0; background: var(--night-0); color: var(--moon); font: 14px/1.4 system-ui, sans-serif; }
    h1, h2 { margin: 0 0 8px; font-weight: 700; }
    h1 { font-size: 18px; } h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--steel-2); }
    button { background: var(--night-2); color: var(--moon); border: 2px solid var(--steel-2); border-radius: 6px; padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { border-color: var(--amber-1); }
    #banner { display: none; background: var(--danger); color: #fff; padding: 10px 16px; font-weight: 700; }
    #banner[data-show] { display: block; }
    #layout { display: flex; gap: 16px; padding: 16px; align-items: flex-start; flex-wrap: wrap; }
    #stage { flex: 0 0 640px; }
    #wrap { position: relative; width: 640px; height: 480px; background: var(--night-1); border: 2px solid var(--steel-1); border-radius: 8px; overflow: hidden; }
    #wrap video, #wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #wrap video { object-fit: cover; }
    #prompt { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px; background: rgba(7,11,24,.75); text-align: center; font-weight: 700; }
    #prompt[hidden] { display: none; }
    #progress { height: 8px; background: var(--steel-0); border-radius: 4px; margin-top: 8px; overflow: hidden; }
    #progress > div { height: 100%; width: 0; background: var(--amber-1); transition: width 60ms linear; }
    #controls { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
    #panel { flex: 1 1 320px; min-width: 300px; }
    #checklist { flex: 0 0 260px; }
    .card { background: var(--night-1); border: 2px solid var(--steel-1); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-variant-numeric: tabular-nums; }
    .kv span:first-child { color: var(--steel-2); }
    .indicators { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .ind { padding: 8px; border-radius: 6px; text-align: center; font-weight: 700; background: var(--steel-0); color: var(--steel-2); border: 2px solid var(--steel-1); }
    .ind[data-on] { background: var(--amber-1); color: var(--night-0); border-color: var(--amber-1); }
    .gauge { margin: 6px 0; }
    .gauge .label { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
    .gauge .bar { position: relative; height: 10px; background: var(--steel-0); border-radius: 5px; margin-top: 2px; }
    .gauge .fill { position: absolute; top: 0; bottom: 0; background: var(--pose); border-radius: 5px; }
    .gauge .fill[data-on] { background: var(--amber-1); }
    .gauge .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--danger); }
    .gauge .mark.exit { background: var(--moon); opacity: .6; }
    .bool { display: inline-block; padding: 2px 8px; border-radius: 4px; background: var(--steel-0); color: var(--steel-2); margin: 2px 4px 2px 0; }
    .bool[data-on] { background: var(--pose); color: var(--night-0); }
    .row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--steel-0); }
    .row .dot { width: 12px; height: 12px; border-radius: 6px; background: var(--steel-0); }
    .row .dot[data-on] { background: var(--amber-1); }
    .row input { accent-color: var(--amber-1); width: 18px; height: 18px; }
  </style>
</head>
<body>
  <div id="banner"></div>
  <div id="layout">
    <section id="stage">
      <div id="wrap">
        <canvas id="overlay"></canvas>
        <div id="prompt" hidden>
          <div id="prompt-text">Starting camera…</div>
          <div id="progress"><div></div></div>
        </div>
      </div>
      <div id="controls">
        <button id="calibrate">Calibrate</button>
        <span id="cal-state"></span>
      </div>
    </section>
    <section id="panel"></section>
    <section id="checklist"></section>
  </div>
  <script type="module" src="/src/harness/main.ts"></script>
</body>
</html>
